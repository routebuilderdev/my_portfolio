name: Build and deploy portfolio

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run check

      - name: Build site
        run: npm run build

      - name: Set up deploy key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts

      - name: Sync dist/ to VPS
        run: |
          rsync -az --delete -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no" ./dist/ \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:${{ secrets.VPS_TARGET }}"

      - name: Verify the deployed site responds
        run: |
          for attempt in $(seq 1 10); do
            status=$(curl -s -o /dev/null -w '%{http_code}' "$SITE_URL/")
            if [ "$status" = "200" ]; then
              echo "$SITE_URL returned 200"
              exit 0
            fi
            echo "attempt $attempt: got $status"
            sleep 3
          done
          echo "$SITE_URL did not return 200 after deploy"
          exit 1
        env:
          SITE_URL: https://routebuilder.developer.li
